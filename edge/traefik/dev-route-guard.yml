# Dev-route isolation guard (t1143u dev-isolation).
#
# website-staging redeploys currently fail and roll back: the runtime image
# built from current main has no in-image HTTP client (deliberate minimal
# runtime), so Coolify's in-container healthcheck (`curl ... /health/ready`)
# never passes. The old (curl-capable) container keeps serving with STALE
# Traefik labels that still route dev.datatalks.club to the production
# website container (production website DB).
#
# The Coolify FQDN record for website-staging no longer lists
# dev.datatalks.club (removed via API); this shadow router enforces the
# separation at Traefik until a successful redeploy converges the container
# labels. Priority 500 beats the stale docker router (rule-length priority).
# Service noop@file (defined by Coolify's default_redirect_503.yaml) answers
# "no available server" — the same no-route signal as a removed Host rule.
#
# Mechanics note: http and https need SEPARATE routers — a router carrying a
# `tls:` block does not match plain-HTTP traffic.
#
# Scope: Host(dev.datatalks.club) ONLY. prod.datatalks.club,
# origin.website.datatalks.club and sslip routes are untouched.
#
# Placement (contabo-a only — origin.website resolves to .163):
#   scp edge/traefik/dev-route-guard.yml contabo-a:/tmp/ && \
#   ssh contabo-a 'sudo install -m 644 /tmp/dev-route-guard.yml /data/coolify/proxy/dynamic/dev-route-guard.yml'
# Removal condition: container labels for wodajblzizrjunwme3ossav3 no longer
# contain dev.datatalks.club (verify with the edge test), then delete this
# file from the host AND the repo.
http:
  routers:
    dev-isolation-website-dev-http:
      rule: "Host(`dev.datatalks.club`)"
      service: "noop@file"
      entryPoints:
        - http
      priority: 500
    dev-isolation-website-dev-https:
      rule: "Host(`dev.datatalks.club`)"
      service: "noop@file"
      entryPoints:
        - https
      priority: 500
      tls:
        certResolver: letsencrypt
