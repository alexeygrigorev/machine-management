# WG reboot-race fix (t1035u): allow binding 10.100.0.2 before wg0 is up.
# Docker can then start WG-bound containers (pg-shared-wg-bridge :5432,
# postgres-exporters :9187/:9188) even if wg-quick@wg0 is still coming up;
# traffic flows as soon as wg0 appears. Applied live + persisted.
net.ipv4.ip_nonlocal_bind = 1
